services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: svci_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    ports:
      - '8000:8000'
    environment:
      - APP_ENV=local
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=svci_dev
      - DB_USERNAME=svci_dev
      - DB_PASSWORD=svci_secret
      - BROADCAST_CONNECTION=reverb
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_ALLOWED_ORIGINS=http://localhost:8000
      - VITE_REVERB_APP_KEY=${REVERB_APP_KEY:-local-key}
      - VITE_REVERB_HOST=127.0.0.1
      - VITE_REVERB_PORT=8080
      - VITE_REVERB_SCHEME=http
      - MAIL_MAILER=resend
      - RESEND_KEY=${RESEND_KEY:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-SVCI Document System}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - svci

  mysql:
    image: mysql:8
    container_name: svci_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: svci_dev
      MYSQL_USER: svci_dev
      MYSQL_PASSWORD: svci_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./.docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot_secret']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - svci

  reverb:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: svci_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=svci_dev
      - DB_USERNAME=svci_dev
      - DB_PASSWORD=svci_secret
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_ALLOWED_ORIGINS=http://localhost:8000
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - '8080:8080'
    depends_on:
      - app
    networks:
      - svci

volumes:
  mysql_data:
    driver: local

  vendor_data:
    driver: local

  node_modules_data:
    driver: local

networks:
  svci:
    driver: bridge
